<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White ring around outer edge for visibility -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  
  <!-- Outer shadow for depth -->
  <ellipse cx="32" cy="58" rx="28" ry="4" fill="#000" opacity="0.3"/>
  
  <!-- Record body with realistic grooves -->
  <circle cx="32" cy="32" r="30" fill="#111"/>
  <circle cx="32" cy="32" r="29" fill="#1a1a1a"/>
  
  <!-- Grooves - subtle concentric rings -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#222" stroke-width="0.3"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#1e1e1e" stroke-width="0.3"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#252525" stroke-width="0.4"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1c1c1c" stroke-width="0.3"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#282828" stroke-width="0.5"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#1a1a1a" stroke-width="0.3"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#2d2d2d" stroke-width="0.4"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#1f1f1f" stroke-width="0.3"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#1d1d1d" stroke-width="0.3"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#333" stroke-width="0.4"/>
  
  <!-- Paper label -->
  <circle cx="32" cy="32" r="14" fill="#f5f0e6"/>
  <circle cx="32" cy="32" r="13.5" fill="#faf5ed"/>
  
  <!-- Label border/ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#d4c5a9" stroke-width="0.5"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#e8dcc8" stroke-width="0.3"/>
  
  <!-- Label text lines (simulating printed text) -->
  <rect x="22" y="28" width="20" height="1.2" rx="0.5" fill="#8b7355" opacity="0.7"/>
  <rect x="24" y="31" width="16" height="0.8" rx="0.4" fill="#a08060" opacity="0.5"/>
  <rect x="25" y="34" width="14" height="0.8" rx="0.4" fill="#a08060" opacity="0.5"/>
  
  <!-- Metal spindle dot -->
  <circle cx="32" cy="32" r="3.5" fill="#888"/>
  <circle cx="32" cy="32" r="3" fill="#999"/>
  <circle cx="32" cy="32" r="2.5" fill="#aaa"/>
  <circle cx="32" cy="32" r="2" fill="#bbb"/>
  <circle cx="32" cy="32" r="1.5" fill="#ccc"/>
  <circle cx="32" cy="32" r="1" fill="#ddd"/>
  <circle cx="32" cy="32" r="0.5" fill="#eee"/>
  
  <!-- Highlight on spindle -->
  <ellipse cx="31" cy="31" rx="1" ry="0.6" fill="#fff" opacity="0.6"/>
  
  <!-- Subtle record edge highlight -->
  <path d="M58 32 A26 26 0 0 1 6 32" fill="none" stroke="#333" stroke-width="0.5" opacity="0.5"/>
</svg>
